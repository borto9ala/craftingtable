[package]
name = "craftingtable"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
dialoguer = "0.11"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["avif", "gif", "jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"
